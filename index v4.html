<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark">
<title>No More Then Ten</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap">
<style>
:root{--h:'Covered By Your Grace','Bradley Hand','Segoe Print','Comic Sans MS',cursive;--f:#f2f2f2;--d:#777}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#000;color:var(--f);font:15px/1.6 ui-monospace,Menlo,Consolas,monospace;overflow-x:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#bg{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,section,footer{position:relative;z-index:1}
#intro{position:fixed;inset:0;background:#000;z-index:9;display:flex;align-items:center;justify-content:center;transition:opacity .9s;cursor:pointer}
#num{font:400 clamp(8rem,38vw,18rem)/1 var(--h);animation:bo .25s steps(2) infinite}
.skip{position:absolute;bottom:2rem;font-size:.65rem;letter-spacing:.3em;color:var(--d);text-transform:uppercase}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1rem;gap:.8rem}
#ch{width:min(74vw,330px);height:min(74vw,330px);cursor:pointer}
h1{font:400 clamp(2.6rem,12vw,6.8rem)/.95 var(--h);margin:0}
h1 span{display:inline-block;animation:bo .5s steps(2) infinite}
@keyframes bo{50%{transform:translate(1px,-1px) rotate(1.3deg)}}
.sub{font-size:.78rem;letter-spacing:.1em;color:#aaa;min-height:3em;max-width:32ch}
.dn{font:2.4rem var(--h);animation:bob 1.6s ease-in-out infinite;color:#888}
@keyframes bob{50%{transform:translateY(10px)}}
.man{padding:22vh 1.2rem;text-align:center;font:400 clamp(1.9rem,7.4vw,3.8rem)/1.3 var(--h)}
.man p{margin:.4em 0}
.rv{opacity:0;transform:translateY(26px) rotate(-1.2deg);transition:opacity .9s,transform .9s}.rv.in{opacity:1;transform:none}
.x{background:linear-gradient(#f2f2f2,#f2f2f2) no-repeat 0 58%/0 3px;transition:background-size .8s .7s}.in .x{background-size:100% 3px}
.drop{padding:10vh 1rem 14vh;display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center}
h2{font:400 clamp(2rem,8vw,3.4rem) var(--h);margin:0}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:min(92vw,440px);scrollbar-width:none;cursor:pointer}.gal::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:#000}
.sl img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .5s}.sl:hover img{transform:rotate(-2deg) scale(1.03)}
.dots{display:flex;gap:.6rem}.dots i{width:7px;height:7px;border-radius:50%;background:#333;display:block;transition:.3s}.dots i.on{background:#ddd;transform:scale(1.4)}
#cap{font:1.7rem var(--h);min-height:1.3em;color:#ccc}
#tally{width:min(86vw,380px)}
.hat{stroke:#f2f2f2;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.pw{position:relative;display:flex;align-items:center;justify-content:center;gap:.9rem}
.pr{display:inline-flex;align-items:center;gap:.5rem;font:3.6rem var(--h)}
#inf{width:2.1rem;height:2.1rem;border:2px solid #aaa;border-radius:52% 48% 55% 45%/48% 55% 45% 52%;background:none;color:#ccc;font:1.5rem/1 var(--h);padding:0;cursor:pointer;transition:.25s}#inf:hover{background:#f2f2f2;color:#000;transform:rotate(-8deg) scale(1.1)}
#chart{display:none;position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);width:min(90vw,340px);background:#060606;border:2px solid #f2f2f2;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:1.3rem 1.2rem;z-index:6;font:1.35rem/1.3 var(--h);text-align:left}
#chart b{font-weight:400;font-size:1.8rem;display:block;margin-bottom:.3rem}
.rw{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.1rem .3rem;color:#aaa}.rw.me{color:#000;background:#f2f2f2;border-radius:6px}.rw.me .hat{stroke:#000}
.rw span:first-child{display:flex;align-items:center;gap:6px}.rw .hat{stroke-width:2}.left{font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:var(--d)}
.buy{display:inline-block;margin:.6rem 0;padding:.8rem 1.8rem;border:2px solid var(--f);color:var(--f);text-decoration:none;font:1.9rem var(--h);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;transition:.25s}
.buy:hover{background:var(--f);color:#000;transform:rotate(-3deg) scale(1.05)}
.nr{font-size:.65rem;color:var(--d);letter-spacing:.2em;text-transform:uppercase}
footer{text-align:center;padding:4rem 1rem 6rem;font-size:.65rem;letter-spacing:.2em;color:#555;text-transform:uppercase}
#snd{position:fixed;left:.8rem;bottom:calc(.8rem + env(safe-area-inset-bottom));z-index:5;background:none;border:0;color:#555;font:inherit;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
#sec{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;text-align:center;padding:2rem;font:2.2rem/1.3 var(--h);cursor:pointer}
@media(pointer:fine){body{cursor:none}a,button,#ch,.gal{cursor:none}}
</style></head><body>
